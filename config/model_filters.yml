# Row-level filters used by HPC modelling scripts.
# These filters define modelling cohorts; they do not change preprocessing
# outputs or target selection.

cohort_filters:
  - name: exclude_low_priority_foci
    exclude_if_any_column_equals:
      foco_piel_binary: 1
      foco_osteoarticular_binary: 1
      foco_biliar_binary: 1
      foco_genital_binary: 1
      foco_sistema_nervioso_central_binary: 1
      foco_catéter_venoso_binary: 1
      foco_vías_altas_respiratorias_binary: 1
      foco_cardiovascular_binary: 1

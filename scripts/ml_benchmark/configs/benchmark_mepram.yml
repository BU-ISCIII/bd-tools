# Example MEPRAM benchmark config.
# This config defines the job matrix only; training implementation will use the
# same shape in the next development slice.

data:
  path: preprocess_test_filtered.csv
  weight_column: sample_weight
  target_like_columns:
    - sepsis
    - resultado_hemo
    - resultado_hemo_mo
    - resultado_hemo_grouped
    - resultado_hemo_multilabel
    - all_cult_org
    - dominant_all_cult_org
    - infected_yes_no
    - bmr_etiologia
    - fenotipo_resistencia
    - fenotipo_resistencia_individual
    - fenotipo_resistencia_grouped
    - resistente_cefalosporina
    - resistente_cefalosporina_multi

output_dir: outputs/ml_benchmark/mepram

split:
  strategy: cross_validation
  cv_splits: 5
  test_size: 0.20
  validation_size:
  random_state: 99
  stratify: true

row_filters:
  cohort_filters:
    - name: exclude_minor_foci
      type: exclude_values
      enabled: false
      column: foco
      values:
        - catéter venoso
        - vías altas respiratorias
        - cardiovascular
        - osteoarticular
        - sistema nervioso central
        - genital

    - name: keep_common_foci
      type: min_frequency
      enabled: false
      column: foco
      min_count:
      min_fraction: 0.04
      drop_missing: false

  feature_na_filter:
    enabled: false
    mode: max_fraction
    max_missing_fraction: 0.50
    include_patterns:
      - "*"
    exclude_columns: []

targets:
  - name: sepsis
    type: binary
    main_metric: roc_auc

  - name: resultado_hemo_grouped
    type: multiclass
    main_metric: log_loss

  - name: resistente_cefalosporina
    type: binary
    main_metric: average_precision

models:
  - name: dummy_uniform
    feature_policy: tree_default
  - name: dummy_stratified
    feature_policy: tree_default
  - name: dummy_prior
    feature_policy: tree_default
  - name: logistic
    feature_policy: logistic_default
  - name: logistic_calibrated
    feature_policy: logistic_calibrated
  - name: random_forest
    feature_policy: tree_default
  - name: catboost
    feature_policy: catboost_default
  - name: catboost_calibrated
    feature_policy: catboost_calibrated
  - name: lightgbm
    feature_policy: tree_default
  - name: lightgbm_calibrated
    feature_policy: tree_calibrated
  - name: xgboost
    feature_policy: tree_default

feature_policies:
  logistic_default:
    require_numeric: true
    categorical_handling: one_hot
    scale: standard
    impute_numeric: median
    impute_categorical: most_frequent
    qcut_numeric: optional
    qcut_bins: 4
    iqr_outlier_handling: train_fit
    iqr_multiplier: 3.0
    correlation_filter:
      enabled: true
      threshold: 0.80
      mode: report_then_drop
      manual_groups_first: true
    calibration:
      enabled: false

  logistic_calibrated:
    require_numeric: true
    categorical_handling: one_hot
    scale: standard
    impute_numeric: median
    impute_categorical: most_frequent
    qcut_numeric: optional
    qcut_bins: 4
    iqr_outlier_handling: train_fit
    iqr_multiplier: 3.0
    correlation_filter:
      enabled: true
      threshold: 0.80
      mode: report_then_drop
      manual_groups_first: true
    calibration:
      enabled: true
      method: sigmoid
      cv: 3
      ensemble: true

  tree_default:
    require_numeric: true
    categorical_handling: one_hot
    scale: none
    impute_numeric: median
    impute_categorical: most_frequent
    qcut_numeric: optional
    qcut_bins: 4
    iqr_outlier_handling: train_fit
    iqr_multiplier: 3.0
    correlation_filter:
      enabled: false
      threshold: 0.90
      mode: report_only
      manual_groups_first: true
    calibration:
      enabled: false

  tree_calibrated:
    require_numeric: true
    categorical_handling: one_hot
    scale: none
    impute_numeric: median
    impute_categorical: most_frequent
    qcut_numeric: optional
    qcut_bins: 4
    iqr_outlier_handling: train_fit
    iqr_multiplier: 3.0
    correlation_filter:
      enabled: false
      threshold: 0.90
      mode: report_only
      manual_groups_first: true
    calibration:
      enabled: true
      method: sigmoid
      cv: 3
      ensemble: true

  catboost_default:
    require_numeric: false
    categorical_handling: native
    scale: none
    impute_numeric: median
    impute_categorical: most_frequent
    qcut_numeric: optional
    qcut_bins: 4
    iqr_outlier_handling: train_fit
    iqr_multiplier: 3.0
    correlation_filter:
      enabled: false
      threshold: 0.90
      mode: report_only
      manual_groups_first: true
    calibration:
      enabled: false

  catboost_calibrated:
    require_numeric: false
    categorical_handling: native
    scale: none
    impute_numeric: median
    impute_categorical: most_frequent
    qcut_numeric: optional
    qcut_bins: 4
    iqr_outlier_handling: train_fit
    iqr_multiplier: 3.0
    correlation_filter:
      enabled: false
      threshold: 0.90
      mode: report_only
      manual_groups_first: true
    calibration:
      enabled: true
      method: sigmoid
      cv: 3
      ensemble: true

feature_groups:
  temperature:
    description: Alternative temperature/fever representations available after preprocessing.
    alternatives:
      raw:
        include:
          - temperatura
        exclude:
          - temperatura_recoded
          - sintoma_fiebre
          - sintoma_fiebre_categorico

      binary_flags:
        include:
          - sintoma_fiebre
        exclude:
          - temperatura
          - temperatura_recoded
          - sintoma_fiebre_categorico

      category:
        include:
          - temperatura_recoded
          - sintoma_fiebre_categorico
        exclude:
          - temperatura
          - sintoma_fiebre

feature_views:
  - name: raw_vitals
    description: Prefer raw continuous vital-sign representations.
    include_patterns:
      - "*"
    groups:
      temperature: raw

  - name: binary_vitals
    description: Prefer clinically thresholded vital-sign flags.
    include_patterns:
      - "*"
    groups:
      temperature: binary_flags

  - name: categorical_vitals
    description: Prefer ordinal/categorical vital-sign representations.
    include_patterns:
      - "*"
    groups:
      temperature: category

feature_sets:
  - name: all_features
    strategy: none

  - name: shap_rfecv_uncapped
    strategy: shap_rfecv
    max_features:

  - name: shap_rfecv_top_20
    strategy: shap_rfecv
    max_features: 30


feature_selection:
  cache_enabled: true
  shap_rfecv:
    cv_splits: 2
    step_fraction: 0.50
    min_features_to_select: 20
    max_shap_rows: 1000
    max_selector_rows: 2500
    selector_estimator_params:
      logistic:
        max_iter: 1000
      lightgbm:
        n_estimators: 80
        learning_rate: 0.05
        num_leaves: 31
      catboost:
        iterations: 80
        depth: 6
      random_forest:
        n_estimators: 100
      xgboost:
        n_estimators: 100

tuning:
  enabled: false
  n_trials: 25
  timeout_seconds:
  cv_splits: 3
  metric:
  direction: auto
  reuse_existing: true
  storage: sqlite
  models:
    - logistic
    - logistic_calibrated
    - catboost
    - catboost_calibrated
    - lightgbm
    - lightgbm_calibrated

compute:
  default_n_jobs: 1
  skip_existing: true
  max_diagnostic_rows: 1000

slurm:
  script_path: scripts/run_benchmark.py
  job_name: ml_benchmark
  cpus_per_task: 8
  mem: 32G
  time: "08:00:00"
  output: logs/benchmark_%A_%a.out
  error: logs/benchmark_%A_%a.err

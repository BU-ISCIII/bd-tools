# Example MEPRAM benchmark config.
# This config defines the job matrix only; training implementation will use the
# same shape in the next development slice.

data:
  path: preprocess_test_filtered.csv
  weight_column: sample_weight
  target_like_columns:
    - sepsis
    - resultado_hemo
    - resultado_hemo_mo
    - resultado_hemo_grouped
    - resultado_hemo_multilabel
    - all_cult_org
    - dominant_all_cult_org
    - infected_yes_no
    - bmr_etiologia
    - fenotipo_resistencia
    - fenotipo_resistencia_individual
    - fenotipo_resistencia_grouped
    - resistente_cefalosporina
    - resistente_cefalosporina_multi

output_dir: outputs/ml_benchmark/mepram

split:
  strategy: cross_validation
  cv_splits: 5
  test_size: 0.20
  validation_size:
  random_state: 99
  stratify: true

row_filters:
  cohort_filters:
    - name: exclude_minor_foci
      type: exclude_values
      enabled: false
      column: foco
      values:
        - catéter venoso
        - vías altas respiratorias
        - cardiovascular
        - osteoarticular
        - sistema nervioso central
        - genital

    - name: keep_common_foci
      type: min_frequency
      enabled: false
      column: foco
      min_count:
      min_fraction: 0.04
      drop_missing: false

  feature_na_filter:
    enabled: false
    mode: max_fraction
    max_missing_fraction: 0.50
    include_patterns:
      - "*"
    exclude_columns: []

targets:
  - name: sepsis
    type: binary
    main_metric: roc_auc

  - name: resultado_hemo_grouped
    type: multiclass
    main_metric: log_loss

  - name: resistente_cefalosporina
    type: binary
    main_metric: average_precision

models:
  #- name: dummy_uniform
  #   feature_policy: tree_default
  # - name: dummy_stratified
  #   feature_policy: tree_default
  - name: dummy_prior
    feature_policy: tree_default
  - name: logistic
    feature_policy: logistic_default
  - name: logistic_qcut_only
    feature_policy: logistic_qcut_only
  - name: logistic_calibrated
    feature_policy: logistic_calibrated
  # - name: random_forest
  #   feature_policy: tree_default
  - name: catboost
    feature_policy: catboost_default
  - name: catboost_calibrated
    feature_policy: catboost_calibrated
  - name: lightgbm
    feature_policy: tree_default
  - name: lightgbm_qcut_only
    feature_policy: tree_qcut_only
  - name: lightgbm_calibrated
    feature_policy: tree_calibrated
  # - name: xgboost
  #   feature_policy: tree_default

feature_policies:
  logistic_default:
    require_numeric: true
    categorical_handling: one_hot
    scale: standard
    impute_numeric: median
    impute_categorical: most_frequent
    qcut_numeric: none
    qcut_bins: 4
    iqr_outlier_handling: train_fit
    iqr_multiplier: 3.0
    correlation_filter:
      enabled: true
      threshold: 0.80
      mode: report_then_drop
      manual_groups_first: true
    calibration:
      enabled: false

  logistic_qcut_only:
    require_numeric: true
    categorical_handling: one_hot
    scale: standard
    impute_numeric: median
    impute_categorical: most_frequent
    qcut_numeric: replace
    qcut_bins: 4
    iqr_outlier_handling: train_fit
    iqr_multiplier: 3.0
    correlation_filter:
      enabled: true
      threshold: 0.80
      mode: report_then_drop
      manual_groups_first: true
    calibration:
      enabled: false

  logistic_calibrated:
    require_numeric: true
    categorical_handling: one_hot
    scale: standard
    impute_numeric: median
    impute_categorical: most_frequent
    qcut_numeric: none
    qcut_bins: 4
    iqr_outlier_handling: train_fit
    iqr_multiplier: 3.0
    correlation_filter:
      enabled: true
      threshold: 0.80
      mode: report_then_drop
      manual_groups_first: true
    calibration:
      enabled: true
      method: sigmoid
      cv: 3
      ensemble: true

  tree_default:
    require_numeric: true
    categorical_handling: one_hot
    scale: none
    impute_numeric: median
    impute_categorical: most_frequent
    qcut_numeric: none
    qcut_bins: 4
    iqr_outlier_handling: train_fit
    iqr_multiplier: 3.0
    correlation_filter:
      enabled: false
      threshold: 0.90
      mode: report_only
      manual_groups_first: true
    calibration:
      enabled: false

  tree_qcut_only:
    require_numeric: true
    categorical_handling: one_hot
    scale: none
    impute_numeric: median
    impute_categorical: most_frequent
    qcut_numeric: replace
    qcut_bins: 4
    iqr_outlier_handling: train_fit
    iqr_multiplier: 3.0
    correlation_filter:
      enabled: false
      threshold: 0.90
      mode: report_only
      manual_groups_first: true
    calibration:
      enabled: false

  tree_calibrated:
    require_numeric: true
    categorical_handling: one_hot
    scale: none
    impute_numeric: median
    impute_categorical: most_frequent
    qcut_numeric: none
    qcut_bins: 4
    iqr_outlier_handling: train_fit
    iqr_multiplier: 3.0
    correlation_filter:
      enabled: false
      threshold: 0.90
      mode: report_only
      manual_groups_first: true
    calibration:
      enabled: true
      method: sigmoid
      cv: 3
      ensemble: true

  catboost_default:
    require_numeric: false
    categorical_handling: native
    scale: none
    impute_numeric: median
    impute_categorical: most_frequent
    qcut_numeric: none
    qcut_bins: 4
    iqr_outlier_handling: train_fit
    iqr_multiplier: 3.0
    correlation_filter:
      enabled: false
      threshold: 0.90
      mode: report_only
      manual_groups_first: true
    calibration:
      enabled: false

  catboost_calibrated:
    require_numeric: false
    categorical_handling: native
    scale: none
    impute_numeric: median
    impute_categorical: most_frequent
    qcut_numeric: none
    qcut_bins: 4
    iqr_outlier_handling: train_fit
    iqr_multiplier: 3.0
    correlation_filter:
      enabled: false
      threshold: 0.90
      mode: report_only
      manual_groups_first: true
    calibration:
      enabled: true
      method: sigmoid
      cv: 3
      ensemble: true

feature_groups:
  temperature:
    description: Alternative temperature/fever representations, including sources that can generate temperatura_qcut.
    alternatives:
      raw:
        include:
          - temperatura
        exclude:
          - temperatura_qcut
          - hipotermia_hipertermia
          - sintoma_fiebre
          - sintoma_fiebre_categorico

      binary_flags:
        include:
          - hipotermia_hipertermia
          - sintoma_fiebre
        exclude:
          - temperatura
          - temperatura_qcut
          - sintoma_fiebre_categorico

      category:
        include:
          - sintoma_fiebre_categorico
        exclude:
          - temperatura
          - temperatura_qcut
          - hipotermia_hipertermia
          - sintoma_fiebre

      qcut_source:
        include:
          - temperatura
        exclude:
          - hipotermia_hipertermia
          - sintoma_fiebre
          - sintoma_fiebre_categorico

  heart_rate:
    description: Alternative heart-rate representations, including sources that can generate frec_cardiaca_qcut.
    alternatives:
      raw:
        include:
          - frec_cardiaca
        exclude:
          - frec_cardiaca_qcut
          - taquicardia
      binary_flags:
        include:
          - taquicardia
        exclude:
          - frec_cardiaca
          - frec_cardiaca_qcut
      qcut_source:
        include:
          - frec_cardiaca
        exclude:
          - taquicardia

  respiratory_rate:
    description: Alternative respiratory-rate representations, including sources that can generate frec_respiratoria_qcut.
    alternatives:
      raw:
        include:
          - frec_respiratoria
        exclude:
          - frec_respiratoria_qcut
          - taquipnea
      binary_flags:
        include:
          - taquipnea
        exclude:
          - frec_respiratoria
          - frec_respiratoria_qcut
      qcut_source:
        include:
          - frec_respiratoria
        exclude:
          - taquipnea

  oxygen_saturation:
    description: Alternative oxygen-saturation representations, including sources that can generate saturacion_o2_qcut.
    alternatives:
      raw:
        include:
          - saturacion_o2
        exclude:
          - saturacion_o2_qcut
          - hipoxemia
      binary_flags:
        include:
          - hipoxemia
        exclude:
          - saturacion_o2
          - saturacion_o2_qcut
      qcut_source:
        include:
          - saturacion_o2
        exclude:
          - hipoxemia

  lactate:
    description: Lactate source variable that can generate lactato_serico_qcut in model preprocessing.
    alternatives:
      raw:
        include:
          - lactato_serico
        exclude:
          - lactato_serico_qcut
      qcut_source:
        include:
          - lactato_serico

  blood_pressure:
    description: Blood-pressure source variable that can generate tension_arterial_qcut in model preprocessing.
    alternatives:
      raw:
        include:
          - tension_arterial
        exclude:
          - tension_arterial_qcut
      qcut_source:
        include:
          - tension_arterial

  inflammatory_markers:
    description: Continuous analytical markers that can generate model-fitted qcut variables.
    alternatives:
      raw:
        include:
          - proteina_c_reactiva
          - bilirrubina
          - plaquetas
          - creatinina
        exclude:
          - proteina_c_reactiva_qcut
          - bilirrubina_qcut
          - plaquetas_qcut
          - creatinina_qcut
      qcut_source:
        include:
          - proteina_c_reactiva
          - bilirrubina
          - plaquetas
          - creatinina

  symptoms:
    description: Symptom alternatives where preprocessing keeps both binary and categorical codifications.
    alternatives:
      binary_flags:
        include_patterns:
          - "sintoma_*"
        exclude_patterns:
          - "sintoma_*_categorico"
      category:
        include_patterns:
          - "sintoma_*_categorico"
        exclude:
          - sintoma_abdominal
          - sintoma_articular
          - sintoma_cefalea
          - sintoma_costal
          - sintoma_diarrea
          - sintoma_disuria
          - sintoma_fiebre
          - sintoma_mucosa
          - sintoma_náuseas
          - sintoma_piel
          - sintoma_polaquiuria
          - sintoma_recto
          - sintoma_renal
          - sintoma_respirar
          - sintoma_tos
          - sintoma_vómitos

  previous_antibiotic_families:
    description: Previous-antibiotic family alternatives with count and binary codifications.
    alternatives:
      counts:
        include_patterns:
          - "antib_previo_*_counts"
        exclude_patterns:
          - "antib_previo_*_binary"
      binary_flags:
        include_patterns:
          - "antib_previo_*_binary"
        exclude_patterns:
          - "antib_previo_*_counts"

feature_views:
  - name: raw_vitals
    description: Prefer raw continuous vital-sign representations.
    include_patterns:
      - "*"
    groups:
      temperature: raw
      heart_rate: raw
      respiratory_rate: raw
      oxygen_saturation: raw
      lactate: raw
      blood_pressure: raw
      inflammatory_markers: raw
      symptoms: binary_flags
      previous_antibiotic_families: counts

  - name: binary_vitals
    description: Prefer clinically thresholded vital-sign flags.
    include_patterns:
      - "*"
    groups:
      temperature: binary_flags
      heart_rate: binary_flags
      respiratory_rate: binary_flags
      oxygen_saturation: binary_flags
      lactate: raw
      blood_pressure: raw
      inflammatory_markers: raw
      symptoms: binary_flags
      previous_antibiotic_families: binary_flags

  - name: categorical_vitals
    description: Prefer ordinal/categorical vital-sign representations.
    include_patterns:
      - "*"
    groups:
      temperature: category
      heart_rate: raw
      respiratory_rate: raw
      oxygen_saturation: raw
      lactate: raw
      blood_pressure: raw
      inflammatory_markers: raw
      symptoms: category
      previous_antibiotic_families: counts

feature_sets:
  - name: all_features
    strategy: none

  - name: shap_rfecv_uncapped
    strategy: shap_rfecv
    max_features:

  - name: shap_rfecv_top_20
    strategy: shap_rfecv
    max_features: 30


feature_selection:
  cache_enabled: true
  shap_rfecv:
    cv_splits: 2
    step_fraction: 0.50
    min_features_to_select: 20
    max_shap_rows: 1000
    max_selector_rows: 2500
    selector_estimator_params:
      logistic:
        max_iter: 1000
      lightgbm:
        n_estimators: 80
        learning_rate: 0.05
        num_leaves: 31
      catboost:
        iterations: 80
        depth: 6
      random_forest:
        n_estimators: 100
      xgboost:
        n_estimators: 100

tuning:
  enabled: false
  n_trials: 25
  timeout_seconds:
  cv_splits: 3
  metric:
  direction: auto
  reuse_existing: true
  storage: sqlite
  models:
    - logistic
    - logistic_qcut_only
    - logistic_calibrated
    - catboost
    - catboost_calibrated
    - lightgbm
    - lightgbm_qcut_only
    - lightgbm_calibrated

compute:
  default_n_jobs: 1
  skip_existing: true
  max_diagnostic_rows: 1000

slurm:
  script_path: scripts/run_benchmark.py
  job_name: ml_benchmark
  cpus_per_task: 8
  mem: 32G
  time: "08:00:00"
  output: logs/benchmark_%A_%a.out
  error: logs/benchmark_%A_%a.err

# BACTHECOM preprocessing configuration for mortality and staged early-mortality modelling.
#
# Prediction unit:
#   One row per record_id + fecha_ingreso + selected fecha_hemocultivo.
#
# Intended staged modelling:
#   Stage 1: any mortality.
#   Stage 2: early mortality among mortality-positive patients, using either 14 or 30 days.

metadata:
  config_name: bacthecom_mortality_episode_level
  config_version: "0.2.0"

episode_definition:
  base_admission_keys:
    - record_id
    - fecha_ingreso
  episode_keys:
    - record_id
    - fecha_ingreso
    - fecha_hemocultivo
  hemoculture_pre_admission_buffer_days: 2
  prediction_time: fecha_hemocultivo
  date_granularity: day

targets:
  mortality_any:
    column: mortalidad_any
    date_column: fecha_mortalidad

  early_mortality:
    # Both windows are generated by preprocessing. The modelling lablog/CLI can choose 14 or 30.
    windows_days:
      - 14
      - 30

    # Both reference definitions are generated to avoid ambiguity.
    # For prediction at blood-culture time, prefer the hemoculture-referenced targets.
    reference_dates:
      - fecha_ingreso
      - fecha_hemocultivo
    default_reference_date: fecha_hemocultivo

    columns:
      admission_14: mortalidad_14_dias
      admission_30: mortalidad_30_dias
      hemoculture_14: mortalidad_14_dias_desde_hemocultivo
      hemoculture_30: mortalidad_30_dias_desde_hemocultivo

  required_final_targets:
    - mortalidad_any
    - mortalidad_14_dias
    - mortalidad_30_dias
    - mortalidad_14_dias_desde_hemocultivo
    - mortalidad_30_dias_desde_hemocultivo

features:
  laboratory:
    # Options: none, log1p_selected, log1p_all.
    # Default is conservative for tree models: preserve raw labs unless explicitly listed.
    transform: log1p_selected
    log1p_columns:
      # Add skewed biomarkers here after checking real column names.
      # Examples:
      # - proteina_c_reactiva
      # - procalcitonina
      # - creatinina
      # - bilirrubina
    skip_log1p_columns:
      # Keep bounded or physiologic-scale variables raw.
      # Examples:
      # - sodio
      # - potasio
      # - ph
      # - lactato
    negative_values_to_nan: true
    default_for_unlisted: raw

  vital_signs:
    # auto detects whether saturation is coded as 0.90 or 90.
    oxygen_saturation_scale: auto
    oxygen_saturation_threshold_fraction: 0.90
    oxygen_saturation_threshold_percent: 90

  text_columns:
    drop_list_like_text_features: true

filtering:
  # These columns survive final filtering even if a pattern would otherwise match.
  always_keep_columns:
    - record_id
    - fecha_ingreso
    - fecha_hemocultivo
    - centro 
    - mortalidad_any
    - mortalidad_14_dias
    - mortalidad_30_dias
    - mortalidad_14_dias_desde_hemocultivo
    - mortalidad_30_dias_desde_hemocultivo

  # Explicit leakage / non-modelling / non-machine-readable columns.
  drop_columns:
    - index
    - episode_key
    - fecha_nacimiento
    - age_at_admission
    - age_at_hemoculture

    # Outcome dates and post-index information.
    - fecha_alta
    - fecha_mortalidad
    - dias_hemocultivo_mortalidad
    - duracion_UCI
    - dias_hemocultivo_ingresoUCI
    - dias_hemocultivo_salidaUCI
    - fecha_ingreso_UCI
    - uci_por_el_episodio

    # Detailed/free-text descriptors.
    - tipo_cancer
    - tipo_hepatopatia
    - causa_inmunosupresion
    - clasificacion_quemadura
    - duracion_sintoma

    # Microbiology/resistance text fields not suitable as direct mortality predictors.
    - episode_id
    - id_cultivo
    - especimen
    - organism_list
    - resistance_mechanism_labels
    - microorganismo_recoded
    - dominant_microorganism
    - fenotipo_resistencia
    - resistance_mechanism_target
    - resistente_cefalosporina

    # Aggregation artifacts.
    - laboratorio_n_rows

  drop_patterns:
    - "*_mean"
    - "*_max"
    - "treatment_*"
    - "antibiogram_*"
    - "infection_*_count"

  forbidden_predictor_columns:
    - fecha_alta
    - fecha_mortalidad
    - dias_hemocultivo_mortalidad
    - duracion_UCI
    - dias_hemocultivo_ingresoUCI
    - dias_hemocultivo_salidaUCI
    - fecha_ingreso_UCI
    - uci_por_el_episodio
    - mortalidad

validation:
  require_unique_episode_keys: true
  require_unique_admission_keys: true
  validate_binary_targets: true
  log_target_prevalence: true
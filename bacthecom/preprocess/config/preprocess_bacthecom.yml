# BACTHECOM preprocessing configuration for mortality and staged early-mortality modelling.
#
# Prediction unit:
#   One row per record_id + fecha_ingreso + selected fecha_hemocultivo.
#
# Current hemoculture organism/resistance results are available at prediction time.
# Mortality outcome windows reference admission dates.
#
# Intended staged modelling:
#   Stage 1: any mortality.
#   Stage 2: early mortality among mortality-positive patients, using either 14 or 30 days.

metadata:
  config_name: bacthecom_mortality_episode_level
  config_version: "0.8.0"

merged_csv:
  episode_keys: [hospital, record_id, fecha_ingreso, fecha_hemocultivo]
  missing_tokens: ["", "NA", "N/A", "NaN", "nan", "NULL", "null", "None"]
  drop_columns_file: null
  categorical_columns: [foco, puntaje_child_pugh]
  numeric_columns: [creatinina]
  # Preserve raw missingness; do not impute absent values during preprocessing.
  missing_as_zero_columns: []
  history_windows_days: [30, 90]
  # No prior admission dates: month is a 30-day proxy; 90d is partially known.
  admission_history:
    month_column: hospit_mes_previo
    year_column: hospit_ano_previo
  nonnegative_columns: [edad, leucocitos, neutrofilos, linfocitos, hemoglobina, plaquetas, ast, alt, fosfatasa_alcalina, ldh, bilirrubina_total, bilirrubina_directa, creatinina, lactato_serico, proteina_c_reactiva]
  exclude_predictors:
    - codigo_postal
    - area_hosp
    - admission_id
    - antibiograma*
    - control_foco
    - days_hemoculture_from_admission
    - episodio_uci_n_rows
    - blood_culture_episode_count
    - dominant_microorganismo
    - hospital
    - record_id
    - id_*
    - fecha_*
    - episode_*
    - diff_days_hemocultivo
    - duracion_hospitalizacion
    - duracion_uci
    - dias_hemocultivo_*
    - mortalidad*
    - microorganismo
    - hemo_positivo_si_no
    - fenotipo_resistencia*
    - resultado_antibiograma_*
    - '*_previo_[1-9]*'
    - '*_previa_[1-9]*'
    - '*_prev_[1-9]*'
    - id_otros_cultivos_*
    - microorganismo_otros_cult_*
    - area_hosp_otros_*
    - especimen_*
    - antimicrobiano_previo_*
    - dias_trat_antimicrobiano_*
    - foco_controlado
    - foco_controlable
    - situacion_funcional_basal
    - organo_aparato

  # Include mapped current hemoculture organisms and resistance in predictors.
  # Other-culture results remain audit-only.
  microbiology:
    include_current_results: true
    # All flags encode recorded evidence: zero is not confirmed absence.
    organism_patterns:
      Ecoli: '(?:^|_)(?:escherichia|e)_coli(?:_|$)'
      Kpneumoniae: '(?:^|_)(?:klebsiella|k)_pneumoniae(?:_|$)'
      Paeruginosa: '(?:^|_)(?:pseudomonas|p)_aeruginosa(?:_|$)'
      Saureus: '(?:^|_)(?:staphylococcus|s)_aureus(?:_|$)'
      Enterococcus_faecium: '(?:^|_)(?:enterococcus|e)_faecium(?:_|$)'
      Acinetobacter_baumannii: '(?:^|_)(?:acinetobacter|a)_baumannii(?:_|$)'
      Enterobacter: '(?:^|_)enterobacter(?:_|$)'
    # Fixed E. coli + ESKAPE vocabulary. Everything else maps to Other.
    # Mixed cultures can activate multiple indicators; never fit groups by frequency.
    phenotype_patterns:
      BLEE: 'blee'
      AMPC: 'ampc|cefamicinasa'
      CARB: 'carbapenemasa|(?:^|_)(?:carb|kpc|vim|ndm|imp|oxacbp)(?:_|$)|oxa_?48'
      MRSA: 'mrsa|sarm|meticilina|clxr'
      MDR: '(?:^|_)(?:mr|mdr|xdr)(?:_|$)|multirresistente|multi_r'

  # Output prefix: foco_prev_; source fields: especimen_previo_*.
  previous_sources:
    urinaria: 'orin|urin'
    respiratoria: 'esput|respirat|bronq|bronch|traque|pulmon|pleur|bal(?:_|$)'
    sanguinea: 'sang|blood|hemocult'
    abdominal_biliar: 'abdom|bili|periton|ascit|vesicul|hepat'
    cateter: 'cateter|catheter'
    piel_tejidos_blandos: 'piel|tejido|herida|cutan|ulcer|absces|exud|pus'

  # Configurable research indicators; continuous originals remain in X.
  clinical_features:
    device_columns: [cateter_venoso, sonda_urinaria, sonda_nasogastrica, derivacion_ventriculoper, valvula_prot_cardiaca, portador_otros_disposit]
    binary_rules:
      taquicardia: {column: frec_cardiaca, gt: 100}
      taquipnea: {column: frecuencia_respiratoria, ge: 22}
      hipotension: {column: tension_arterial_sist, le: 100}
      hipoxemia: {column: saturacion_po2, lt: 90}
      hipotermia_hipertermia: {column: temperatura, lt: 36, gt: 38}

  # Project-level pooled groups, not a replacement for the detailed drug taxonomy.
  antibiotic_family_groups:
    Penicilinas: Penicilinas
    Cefalosporinas 1 gen: Cefalosporinas
    Cefalosporinas 2 gen: Cefalosporinas
    Cefalosporinas 3/4 gen: Cefalosporinas
    Carbapenemas: Carbapenemas
    Aminoglucosidos: Aminoglucosidos
    Quinolonas: Quinolonas
    Glicopéptidos: Glicopeptidos_lipopeptidos
    Lipopeptidos: Glicopeptidos_lipopeptidos
    Macrolidos: Macrolidos_lincosamidas
    Lincosamidas: Macrolidos_lincosamidas
    Tetraciclinas: Tetraciclinas
    Tigeciclina: Tetraciclinas
    Azoles: Antifungicos
    Equinocandinas: Antifungicos
    Polienos: Antifungicos
    AntiTuberculoso: Antituberculosos
    Monobactamicos: Otros_antibacterianos
    Fosfomicina: Otros_antibacterianos
    Metronidazol: Otros_antibacterianos
    Nitrofurantoina: Otros_antibacterianos
    Polimixinas: Otros_antibacterianos
    Sulfonamidas: Otros_antibacterianos
    Otros_no_clasificados: Otros_no_clasificados

  antibiotic_aliases:
    amoxiclavulanico: amoxicilina_acido_clavulanico
    amoxicilina_acid_clavulanic: amoxicilina_acido_clavulanico
    amoxicilina_clavulanico: amoxicilina_acido_clavulanico
    ampicilin: ampicilina
    ampicilina: ampicilina
    piperacilina_tazobactam: piperacilina_tazobactam
    trimetoprim_sulfametoxazol: trimetoprim_sulfametoxazol
    cotrimoxazol: trimetoprim_sulfametoxazol
    sulfametoxazol_trimetoprima: trimetoprim_sulfametoxazol
    ciprofloxacino: ciprofloxacina
    norfloxacino: norfloxacina
    voriconazole: voriconazol
    amoxicilina_trihidrato: amoxicilina
    amikacina_sulfato: amikacina
    cefotaxima_sodica: cefotaxima
    cefuroxima_axetilo: cefuroxima
    cefuroxima_sodica: cefuroxima
    cloxacilina_sodica: cloxacilina
    fosfomicina_trometamol: fosfomicina
  antibiotic_atc_names:
    J01CA01: ampicilina
    J01CA04: amoxicilina
    J01CR02: amoxicilina_acido_clavulanico
    J01CR05: piperacilina_tazobactam
    J01EE01: trimetoprim_sulfametoxazol
    J01DB04: cefazolina
    J01DC02: cefuroxima
    J01DD04: ceftriaxona
    J01DH02: meropenem
    J01DH03: ertapenem
    J01MA02: ciprofloxacina
    J01GB03: gentamicina
    J01XA01: vancomicina

episode_definition:
  base_admission_keys:
    - record_id
    - fecha_ingreso
  episode_keys:
    - record_id
    - fecha_ingreso
    - fecha_hemocultivo
  hemoculture_pre_admission_buffer_days: 2
  prediction_time: fecha_hemocultivo
  date_granularity: day

targets:
  mortality_any:
    column: mortalidad_any
    date_column: fecha_mortalidad

  early_mortality:
    # Both windows are generated by preprocessing. The modelling lablog/CLI can choose 14 or 30.
    windows_days:
      - 14
      - 30

    # Early mortality windows are measured from admission.
    reference_dates:
      - fecha_ingreso
    default_reference_date: fecha_ingreso

    columns:
      admission_14: mortalidad_14_dias
      admission_30: mortalidad_30_dias

  required_final_targets:
    - mortalidad_any
    - mortalidad_14_dias
    - mortalidad_30_dias

features:
  laboratory:
    # Options: none, log1p_selected, log1p_all.
    # Default is conservative for tree models: preserve raw labs unless explicitly listed.
    transform: log1p_selected
    log1p_columns:
      # Add skewed biomarkers here after checking real column names.
      # Examples:
      # - proteina_c_reactiva
      # - procalcitonina
      # - creatinina
      # - bilirrubina
    skip_log1p_columns:
      # Keep bounded or physiologic-scale variables raw.
      # Examples:
      # - sodio
      # - potasio
      # - ph
      # - lactato
    negative_values_to_nan: true
    default_for_unlisted: raw

  vital_signs:
    # auto detects whether saturation is coded as 0.90 or 90.
    oxygen_saturation_scale: auto
    oxygen_saturation_threshold_fraction: 0.90
    oxygen_saturation_threshold_percent: 90

  text_columns:
    drop_list_like_text_features: true

filtering:
  # These columns survive final filtering even if a pattern would otherwise match.
  always_keep_columns:
    - record_id
    - fecha_ingreso
    - fecha_hemocultivo
    - centro
    - mortalidad_any
    - mortalidad_14_dias
    - mortalidad_30_dias

  # Explicit leakage / non-modelling / non-machine-readable columns.
  drop_columns:
    - index
    - episode_key
    - fecha_nacimiento
    - age_at_admission
    - age_at_hemoculture

    # Outcome dates and post-index information.
    - fecha_alta
    - fecha_mortalidad
    - dias_hemocultivo_mortalidad
    - duracion_UCI
    - dias_hemocultivo_ingresoUCI
    - dias_hemocultivo_salidaUCI
    - fecha_ingreso_UCI
    - uci_por_el_episodio

    # Detailed/free-text descriptors.
    - tipo_cancer
    - tipo_hepatopatia
    - causa_inmunosupresion
    - clasificacion_quemadura
    - duracion_sintoma

    # Microbiology/resistance text fields not suitable as direct mortality predictors.
    - episode_id
    - id_cultivo
    - especimen
    - organism_list
    - resistance_mechanism_labels
    - microorganismo_recoded
    - dominant_microorganism
    - fenotipo_resistencia
    - resistance_mechanism_target
    - resistente_cefalosporina

    # Aggregation artifacts.
    - laboratorio_n_rows

  drop_patterns:
    - "*_mean"
    - "*_max"
    - "treatment_*"
    - "antibiogram_*"
    - "infection_*_count"

  forbidden_predictor_columns:
    - fecha_alta
    - fecha_mortalidad
    - dias_hemocultivo_mortalidad
    - duracion_UCI
    - dias_hemocultivo_ingresoUCI
    - dias_hemocultivo_salidaUCI
    - fecha_ingreso_UCI
    - uci_por_el_episodio
    - mortalidad

validation:
  require_unique_episode_keys: true
  require_unique_admission_keys: true
  validate_binary_targets: true
  log_target_prevalence: true


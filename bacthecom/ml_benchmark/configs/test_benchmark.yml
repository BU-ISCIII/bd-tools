# Example benchmark config structure for tests and new projects.
#
# Copy this file and replace placeholder paths/columns with project-specific
# values. Keep project-specific configs outside this reusable package when
# possible, for example under <project>/config/.

data:
  # CSV with one row per modelling unit.
  path: tests/data/example_filtered.csv
  # Optional sample-weight column. Leave empty/null if not used.
  weight_column:
  # Outcome-like columns that must be removed from X for every target.
  target_like_columns:
    - example_outcome

output_dir: playground/ml_benchmark/example

split:
  # Current implemented strategy: held-out test split plus CV inside training.
  strategy: cross_validation
  cv_splits: 3
  test_size: 0.20
  validation_size:
  random_state: 42
  stratify: true

row_filters:
  cohort_filters: []
  feature_na_filter:
    enabled: false
    mode: max_fraction
    max_missing_fraction: 0.50
    include_patterns:
      - "*"
    exclude_columns: []

targets:
  - name: example_outcome
    type: binary
    main_metric: average_precision

models:
  - name: dummy_prior
    feature_policy: tree_default
  - name: logistic
    feature_policy: logistic_default

feature_policies:
  logistic_default:
    require_numeric: true
    categorical_handling: one_hot
    scale: standard
    impute_numeric: median
    impute_categorical: most_frequent
    qcut_numeric: none
    qcut_bins: 4
    iqr_outlier_handling: train_fit
    iqr_multiplier: 3.0
    correlation_filter:
      enabled: true
      threshold: 0.80
      mode: report_then_drop
      manual_groups_first: true
    calibration:
      enabled: false

  tree_default:
    require_numeric: true
    categorical_handling: one_hot
    scale: none
    impute_numeric: median
    impute_categorical: most_frequent
    qcut_numeric: none
    qcut_bins: 4
    iqr_outlier_handling: train_fit
    iqr_multiplier: 3.0
    correlation_filter:
      enabled: false
      threshold: 0.90
      mode: report_only
      manual_groups_first: true
    calibration:
      enabled: false

feature_groups: {}

feature_views:
  - name: all_columns
    description: Use every non-target feature.
    include_patterns:
      - "*"
    exclude_columns: []
    exclude_patterns: []
    groups: {}

feature_sets:
  - name: all_features
    strategy: none
    max_features:

feature_selection:
  cache_enabled: true
  shap_rfecv:
    cv_splits: 2
    step_fraction: 0.50
    min_features_to_select: 20
    max_shap_rows: 500
    max_selector_rows:
    selector_estimator_params: {}

tuning:
  enabled: false
  n_trials: 10
  timeout_seconds:
  cv_splits: 3
  metric:
  direction: auto
  reuse_existing: true
  storage: sqlite
  models: []

compute:
  default_n_jobs: 1
  skip_existing: true
  max_diagnostic_rows: 1000

slurm:
  script_path: ml_benchmark/run_benchmark.py
  job_name: ml_benchmark
  cpus_per_task: 1
  max_parallel_tasks: 1
  partition:
  nodelist:
  mem: 8G
  time: "02:00:00"
  output: logs/benchmark_%A_%a.out
